steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/captain-cool:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/captain-cool:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 2: Push image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/captain-cool:$SHORT_SHA'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloudrun'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'captain-cool'
      - '--image=gcr.io/$PROJECT_ID/captain-cool:$SHORT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'

images:
  - 'gcr.io/$PROJECT_ID/captain-cool:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/captain-cool:latest'

timeout: '1200s'
